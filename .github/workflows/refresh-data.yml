name: Refresh market data

on:
  schedule:
    # 03:30 UTC nightly Tue-Sat — after US/European close, before Oslo open
    - cron: "30 3 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance numpy

      - name: Fetch market data
        run: python scripts/fetch_market.py

      - name: Top-up rate-limited histories
        run: |
          python scripts/repair_foreign.py || echo "repair_foreign failed — continuing"
          python scripts/repair_px0.py || echo "repair_px0 failed — continuing"

      - name: Quality gate — refuse to ship broken data
        run: python scripts/validate_data.py

      - name: Commit & push if changed
        run: |
          git add -A assets/ data/
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: nightly Nordnet snapshot $(date -u +%F)"
          git push
